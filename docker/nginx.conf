# =============================================================================
# nginx.conf - Krayin CRM / Railway
#
# NOTA: El placeholder __PORT__ es reemplazado en tiempo de arranque por
# el script entrypoint.sh con el valor de la variable $PORT de Railway.
# =============================================================================

user www-data;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logs a stdout/stderr para que Railway los capture
    access_log /dev/stdout combined;
    error_log  /dev/stderr warn;

    # Optimizaciones de rendimiento
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 64M;

    # Seguridad básica
    server_tokens off;

    # Compresión gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Directorios temporales de nginx (escribibles por www-data sin root)
    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path       /tmp/nginx_proxy;
    fastcgi_temp_path     /tmp/nginx_fastcgi;
    uwsgi_temp_path       /tmp/nginx_uwsgi;
    scgi_temp_path        /tmp/nginx_scgi;

    server {
        # Railway reemplaza __PORT__ via entrypoint.sh con $PORT
        listen __PORT__;
        listen [::]:__PORT__;

        server_name _;
        root /var/www/html/public;
        index index.php;

        charset utf-8;

        # ----------------------------------------------------------------
        # Assets compilados por Vite - cache agresivo (hash en filename)
        # ----------------------------------------------------------------
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        # ----------------------------------------------------------------
        # Assets estáticos generales
        # ----------------------------------------------------------------
        location ~* \.(ico|css|js|gif|jpeg|jpg|png|svg|woff|woff2|ttf|eot|webp|avif)$ {
            expires 30d;
            add_header Cache-Control "public";
            access_log off;
            try_files $uri =404;
        }

        # ----------------------------------------------------------------
        # Ruta principal Laravel
        # ----------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # ----------------------------------------------------------------
        # PHP-FPM via socket Unix
        # ----------------------------------------------------------------
        location ~ \.php$ {
            fastcgi_pass  unix:/run/php-fpm.sock;
            fastcgi_index index.php;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;

            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param PATH_INFO       $fastcgi_path_info;
            fastcgi_param DOCUMENT_ROOT   $realpath_root;

            # Timeouts holgados para exports de PDF, Excel, etc.
            fastcgi_read_timeout 300;
            fastcgi_send_timeout 300;

            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_busy_buffers_size 256k;
        }

        # ----------------------------------------------------------------
        # Bloquear acceso a archivos sensibles
        # ----------------------------------------------------------------
        location ~ /\.(?!well-known).* {
            deny all;
        }

        location ~ /\.env {
            deny all;
        }

        # Health check para Railway
        location /healthz {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
