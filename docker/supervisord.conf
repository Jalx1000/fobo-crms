; =============================================================================
; supervisord.conf — Krayin CRM / Railway
;
; Todo vive en un solo contenedor porque un volumen de Railway se monta en un
; único servicio, y los workers necesitan la media de storage/.
;
; queue-worker y scheduler dependen de RUN_WORKERS (ver entrypoint.sh): deben
; estar activos en UNA sola instancia, porque envían WhatsApp a clientes reales.
; =============================================================================

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=info

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; =============================================================================
; apache — mod_php; arranca como root y baja a www-data por sí mismo
; =============================================================================
[program:apache]
command=apache2-foreground
user=root
autostart=true
autorestart=true
startretries=5
priority=10
stopsignal=WINCH
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; =============================================================================
; queue worker — la cola "whatsapp" (config whatsapp.queue) lleva la entrada y
; salida de mensajes; va primero para que un job de default no la demore.
;
; numprocs=2: cuando uno se recicla por --max-jobs/--max-time, el otro sigue.
; stopwaitsecs > timeout para que el job en curso alcance a terminar.
; =============================================================================
[program:queue-worker]
command=php /var/www/html/artisan queue:work redis --queue=whatsapp,default --tries=3 --timeout=90 --sleep=3 --max-jobs=1000 --max-time=3600
directory=/var/www/html
process_name=%(program_name)s_%(process_num)02d
numprocs=2
user=www-data
environment=HOME="/tmp"
autostart=%(ENV_RUN_WORKERS)s
autorestart=true
startretries=10
startsecs=2
priority=30
stopsignal=TERM
stopwaitsecs=100
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; =============================================================================
; scheduler — schedule:work se alinea al minuto; un bucle con sleep 60 acumula
; retraso y puede saltarse las tareas everyFiveMinutes.
; =============================================================================
[program:scheduler]
command=php /var/www/html/artisan schedule:work --no-interaction
directory=/var/www/html
user=www-data
environment=HOME="/tmp"
autostart=%(ENV_RUN_WORKERS)s
autorestart=true
startretries=5
startsecs=5
priority=40
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
