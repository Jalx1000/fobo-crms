; =============================================================================
; supervisord.conf - Krayin CRM / Railway
;
; Gestiona 4 procesos en un solo contenedor:
;   1. php-fpm   - sirve la aplicación Laravel
;   2. nginx     - proxy reverso, sirve assets estáticos y delega PHP a fpm
;   3. worker    - queue worker de Laravel
;   4. scheduler - cron scheduler de Laravel (reemplaza crontab)
; =============================================================================

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
loglevel=info

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; =============================================================================
; php-fpm - proceso central de PHP
; =============================================================================
[program:php-fpm]
command=php-fpm --nodaemonize --fpm-config /usr/local/etc/php-fpm.conf
user=root
autostart=true
autorestart=true
startretries=5
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; =============================================================================
; nginx - servidor web
; El entrypoint.sh ya habrá reemplazado __PORT__ antes de que supervisor arranque
; =============================================================================
[program:nginx]
command=nginx -g "daemon off;"
user=root
autostart=true
autorestart=true
startretries=5
priority=20
; Depende de que php-fpm ya esté levantado (socket disponible)
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; =============================================================================
; queue worker - procesa jobs de Laravel
;
; numprocs=2: dos workers siempre activos. Cuando uno llega a --max-jobs o
; --max-time y se reinicia, el otro sigue procesando sin interrupciones.
; --max-jobs=1000 / --max-time=3600 son válvulas de seguridad contra leaks.
; stopwaitsecs=100 > timeout=90 para que el job en curso pueda terminar antes
; de que supervisor lo mate con SIGKILL.
; =============================================================================
[program:queue-worker]
command=php /var/www/html/artisan queue:work
    --queue=default
    --tries=3
    --timeout=90
    --sleep=3
    --max-jobs=1000
    --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=2
user=www-data
autostart=true
autorestart=true
startretries=10
priority=30
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopwaitsecs=100
stopsignal=SIGTERM

; =============================================================================
; scheduler - reemplaza el crontab "* * * * * php artisan schedule:run"
;
; Ejecuta schedule:run cada 60 segundos en un bucle infinito.
; El Kernel.php define: $schedule->command('inbound-emails:process')->everyFiveMinutes()
; =============================================================================
[program:scheduler]
command=/bin/bash -c "while true; do php /var/www/html/artisan schedule:run --no-interaction 2>&1; sleep 60; done"
user=www-data
autostart=true
autorestart=true
startretries=5
priority=40
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
